# ofttold-memory bundle patch: inject human-curated standing context once per session.
# Installed with `dsh plugin --profile web add github:IcyDate/ofttold-memory`; a local
# checkout works the same way with a path in place of the github: spec.
#
# `name` must be the actual package name (ofttold-memory): cordis imports by
# name, so a mismatch yields `Cannot find package` for anyone who installs it.
# No paths are hardcoded here on purpose — a patch that points at one machine's
# notes makes the plugin fail to start for everyone else. Sources belong in the
# profile's own patch, where each user sets their own.
- insert:
    - id: ofttold-memory
      name: ofttold-memory
